name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        name: ${{ matrix.os }} · node ${{ matrix.node }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: ['22', '24']
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'npm'

            - run: npm ci

            - run: npm run lint

            - run: npm run format:check

            - run: npm run typecheck

            - name: Version consistency
              run: node scripts/check-release.mjs

            - run: npm test

            - run: npm run build:full

            - name: Smoke-test packed tarball (POSIX)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  set -euxo pipefail
                  cd packages/cli
                  npm pack --pack-destination "$RUNNER_TEMP"
                  TGZ=$(ls "$RUNNER_TEMP"/acp-devtools-*.tgz | head -1)
                  PREFIX="$RUNNER_TEMP/smoke"
                  mkdir -p "$PREFIX"
                  cd "$PREFIX"
                  npm init -y >/dev/null
                  npm install "$TGZ"
                  # Direct probe of the native binding — fails fast with a
                  # bindings-file error if the postinstall didn't produce
                  # build/Release/better_sqlite3.node.
                  node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); db.exec('CREATE TABLE t (x)'); db.close(); console.log('better-sqlite3 OK');"
                  ./node_modules/.bin/acp-devtools --version
                  ./node_modules/.bin/acp-devtools doctor

            - name: Smoke-test packed tarball (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  Set-Location packages/cli
                  npm pack --pack-destination $env:RUNNER_TEMP
                  $tgz = (Get-ChildItem "$env:RUNNER_TEMP/acp-devtools-*.tgz" | Select-Object -First 1).FullName
                  $prefix = Join-Path $env:RUNNER_TEMP 'smoke'
                  New-Item -ItemType Directory -Force -Path $prefix | Out-Null
                  Set-Location $prefix
                  npm init -y | Out-Null
                  npm install $tgz
                  node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); db.exec('CREATE TABLE t (x)'); db.close(); console.log('better-sqlite3 OK');"
                  & "./node_modules/.bin/acp-devtools.cmd" --version
                  & "./node_modules/.bin/acp-devtools.cmd" doctor

    # Installs the Homebrew formula from the current tap against a tarball
    # packed from this commit, so a change that breaks `brew install` (native
    # binding, bin link, `--version`) fails here instead of on users' machines.
    homebrew:
        name: homebrew formula
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - run: npm ci

            - run: npm run build:full

            - name: Pack the CLI
              id: pack
              working-directory: packages/cli
              run: |
                  NAME=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n1)
                  echo "tarball=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"

            - name: Fetch the formula from the tap
              run: curl -fsSL https://raw.githubusercontent.com/maksugr/homebrew-tap/HEAD/Formula/acp-devtools.rb -o "$RUNNER_TEMP/acp-devtools.rb"

            - name: Install and test the formula against this build
              env:
                  TARBALL: ${{ steps.pack.outputs.tarball }}
              run: bash scripts/homebrew/test-formula.sh "$RUNNER_TEMP/acp-devtools.rb" "$TARBALL"

    # Single required status check for everything above: branch rules can
    # require `ci-ok` instead of listing every job, and adding a job or a
    # matrix entry doesn't need a settings change.
    ci-ok:
        name: ci-ok
        if: always()
        needs: [ci, homebrew]
        runs-on: ubuntu-latest
        steps:
            - name: All jobs passed
              env:
                  MATRIX: ${{ needs.ci.result }}
                  HOMEBREW: ${{ needs.homebrew.result }}
              run: |
                  echo "matrix: $MATRIX, homebrew formula: $HOMEBREW"
                  test "$MATRIX" = "success" && test "$HOMEBREW" = "success"
